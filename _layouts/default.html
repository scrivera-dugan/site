<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>

    {% assign description = page.description | default: site.description %}
    <meta name="description" content="{{ description }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- Link previews on LinkedIn, Slack, etc. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/images/sdugan.png' | absolute_url }}">
    <meta name="twitter:card" content="summary">

    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <meta name="theme-color" content="#F8F7F4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131A2B" media="(prefers-color-scheme: dark)">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WDG5FNNXKN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WDG5FNNXKN');
    </script>
</head>
<body>
    <nav class="nav" aria-label="Main">
        <div class="nav-container">
            <a href="{{ '/' | relative_url }}" class="nav-logo" aria-label="Home"><img src="{{ '/images/home-s.jpg' | relative_url }}" alt="" width="40" height="40"></a>
            <div class="nav-links">
                <a href="{{ '/my-work.html' | relative_url }}" {% if page.url contains 'work' %}class="active" aria-current="page"{% endif %}>Portfolio</a>
                <a href="{{ '/resume.html' | relative_url }}" {% if page.url contains 'resume' %}class="active" aria-current="page"{% endif %}>Resume</a>
                <a href="{{ '/friends&philosophy.html' | relative_url }}" {% if page.url contains 'philosophy' %}class="active" aria-current="page"{% endif %}>Philosophy</a>
                <a href="{{ '/about-me.html' | relative_url }}" {% if page.url contains 'about' %}class="active" aria-current="page"{% endif %}>About</a>
            </div>
        </div>
    </nav>

    <main class="main">
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© {{ 'now' | date: "%Y" }} Sarah Dugan · Set in Space Grotesk, Newsreader &amp; JetBrains Mono</p>
            <div class="footer-links">
                <a href="mailto:sarahcdugan@gmail.com">Email</a>
                <a href="https://www.linkedin.com/in/scdugan/" rel="noopener">LinkedIn</a>
                <a href="https://github.com/scrivera-dugan" rel="noopener">GitHub</a>
                <a href="https://substack.com/@sarahdocs" rel="noopener">Substack</a>
            </div>
        </div>
    </footer>
</body>
</html>
