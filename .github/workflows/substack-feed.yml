# Pulls the latest posts from Substack into _data/substack.json once a day.
# GitHub Pages rebuilds the site whenever that file changes.
# Run it by hand anytime from the Actions tab: "Update Substack feed" > Run workflow.
name: Update Substack feed

on:
  schedule:
    - cron: "0 13 * * *"   # daily, 8am Minneapolis time (CDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feed
        run: |
          python3 - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime

          FEED = "https://sarahdocs.substack.com/feed"
          req = urllib.request.Request(FEED, headers={"User-Agent": "sarahdocs.com feed updater"})
          root = ET.fromstring(urllib.request.urlopen(req, timeout=30).read())
          channel = root.find("channel")

          posts = []
          for item in channel.findall("item")[:3]:
              posts.append({
                  "title": item.findtext("title", "").strip(),
                  "link": item.findtext("link", "").strip(),
                  "date": parsedate_to_datetime(item.findtext("pubDate")).date().isoformat(),
              })

          data = {
              "title": channel.findtext("title", "Write this down").strip(),
              "link": channel.findtext("link", "https://sarahdocs.substack.com/").strip(),
              "posts": posts,
          }
          with open("_data/substack.json", "w") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/substack.json; then
            echo "No new posts."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add _data/substack.json
            git commit -m "Update Substack feed"
            git push
          fi
