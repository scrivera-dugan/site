# Single source for the Portfolio page and the home page's "Selected work".
# featured: true puts a project on the home page (keep it to three or four).
# logo picks the mark in _includes/logos (gitbook, gcloud, gemini, google, stellic).
# role and outcome are optional. They only show up once you fill them in,
# and a concrete outcome ("cut support tickets by X%") is the most
# persuasive line on the whole site.

featured:
  title: GitBook Docs Site
  org: GitBook
  logo: gitbook
  kind: Full docs rebuild
  url: https://gitbook.com/docs
  summary: >-
    A ground-up rebuild of GitBook's entire docs — consolidated into a single repo and
    restructured around real user journeys, with hundreds of pages migrated using GitBook's own AI tooling.
  meta: Founding Tech Docs Lead · Shipped 2026

docs:
  - title: Vertex AI Grounding
    org: Google Cloud
    logo: gcloud
    kind: Docs set
    url: https://cloud.google.com/vertex-ai/generative-ai/docs/grounding/overview
    summary: A complete docs set for grounding Gemini responses in factual sources.

  - title: Stellic Learning Center
    org: Stellic
    logo: stellic
    kind: Full docs site, GitBook
    url: https://www.stellic.com/
    # The docs themselves sit behind auth, so this points at the public site.
    gated: true
    summary: An entire docs site built from scratch on GitBook, with 500+ pages of content.

  - title: Gemini Embeddings
    org: Google Cloud
    logo: gemini
    kind: Docs set
    url: https://cloud.google.com/vertex-ai/generative-ai/docs/embeddings/get-text-embeddings
    summary: The embeddings story end to end, from fundamentals to implementation.

  - title: Vector Search
    org: Google Cloud
    logo: gcloud
    kind: Docs set
    url: https://cloud.google.com/vertex-ai/docs/vector-search/overview
    summary: Docs for Google Cloud's Vector Search, which runs similarity search at scale.

