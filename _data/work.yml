# Single source for the Portfolio page and the home page's "Selected work".
# featured: true puts a project on the home page (keep it to three or four).
# role and outcome are optional. They only show up once you fill them in,
# and a concrete outcome ("cut support tickets by X%") is the most
# persuasive line on the whole site.

featured:
  title: GitBook Docs Site
  org: GitBook
  kind: Full docs rebuild
  url: https://gitbook.com/docs
  summary: >-
    A ground-up rebuild of GitBook's entire documentation — consolidated into a single repo and
    restructured around real user journeys, with hundreds of pages migrated using GitBook's own AI tooling.
  meta: Docs Lead · shipped 2026

