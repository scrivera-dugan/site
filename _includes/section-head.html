{%- comment -%}
Section heading: one plain line in the display serif. No pill, no device.
  include.label + include.title  - joined into the heading text
  include.id                     - id for aria-labelledby
{%- endcomment -%}
<header class="section-head">
    <h2 id="{{ include.id }}">{{ include.label }} {{ include.title }}</h2>
</header>
